<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>魔方还原助手</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2533; --muted:#6b7280;
    --line:#e3e7ef; --accent:#3b6ef0; --accent2:#10b981; --warn:#ef5350;
    --cube-gap:#0c0f16;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%,#e8eeff 0%,var(--bg) 55%);
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* ---------- Intro ---------- */
  #intro{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#1a2a6c 0%,#2a5298 45%,#3b6ef0 100%);
    color:#fff;z-index:50;overflow:hidden;
  }
  #intro h1{font-size:34px;letter-spacing:2px;margin:0 0 6px;font-weight:800;}
  #intro p.sub{opacity:.85;margin:0 0 36px;font-size:15px;}
  .intro-cube-wrap{perspective:800px;margin-bottom:30px;}
  .intro-cube{
    width:120px;height:120px;position:relative;transform-style:preserve-3d;
    animation:spin3d 7s linear infinite;
  }
  .intro-cube .fc{position:absolute;width:120px;height:120px;border-radius:10px;
    border:2px solid rgba(255,255,255,.25);box-shadow:inset 0 0 22px rgba(0,0,0,.25);}
  .fc.f-front{transform:translateZ(60px);background:#1db954;}
  .fc.f-back{transform:rotateY(180deg) translateZ(60px);background:#1e6fff;}
  .fc.f-right{transform:rotateY(90deg) translateZ(60px);background:#e53935;}
  .fc.f-left{transform:rotateY(-90deg) translateZ(60px);background:#fb8c00;}
  .fc.f-top{transform:rotateX(90deg) translateZ(60px);background:#f3f3f3;}
  .fc.f-bottom{transform:rotateX(-90deg) translateZ(60px);background:#ffd400;}
  @keyframes spin3d{
    from{transform:rotateX(-22deg) rotateY(0deg);}
    to{transform:rotateX(-22deg) rotateY(360deg);}
  }
  .btn-primary{
    background:#fff;color:#1a2a6c;border:none;padding:14px 38px;border-radius:30px;
    font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .15s;
  }
  .btn-primary:hover{transform:translateY(-2px);}
  .intro-tip{margin-top:18px;font-size:12px;opacity:.7;}

  /* ---------- App ---------- */
  #app{max-width:1080px;margin:0 auto;padding:18px 20px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar h2{margin:0;font-size:22px;font-weight:800;}
  .topbar .hint{color:var(--muted);font-size:13px;}
  .layout{display:flex;flex-direction:column;gap:18px;}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:stretch;}
  @media(max-width:920px){.stage{grid-template-columns:1fr;}}
  #stepPanel{display:flex;flex-direction:column;min-height:0;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;
    box-shadow:0 6px 22px rgba(31,37,51,.05);}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.5px;}

  /* 3D */
  #scene{perspective:1000px;height:380px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#fbfcff,#eef2fb);border-radius:14px;cursor:grab;user-select:none;touch-action:none;}
  #scene:active{cursor:grabbing;}
  #scene canvas{display:block;margin:0 auto;}

  .curmove{margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:var(--accent);min-height:22px;}

  /* net */
  .palette{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .sw{width:34px;height:34px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .12s;}
  .sw:hover{transform:scale(1.08);}
  .sw.sel{box-shadow:0 0 0 3px var(--accent);transform:scale(1.08);}
  .sw.eraser{display:flex;align-items:center;justify-content:center;background:#fff;color:var(--muted);font-size:12px;font-weight:700;}

  .net{display:grid;grid-template-columns:repeat(4,86px);grid-template-rows:repeat(3,86px);
    gap:8px;justify-content:center;margin:6px auto 4px;}
  .nface{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;}
  .nface.U{grid-column:2;grid-row:1;}
  .nface.L{grid-column:1;grid-row:2;}
  .nface.F{grid-column:2;grid-row:2;}
  .nface.R{grid-column:3;grid-row:2;}
  .nface.B{grid-column:4;grid-row:2;}
  .nface.D{grid-column:2;grid-row:3;}
  .nface{position:relative;}
  .nface .lbl{position:absolute;}
  .stk{background:#cfd6e4;border-radius:6px;border:1px solid rgba(0,0,0,.08);cursor:pointer;transition:transform .08s,box-shadow .08s;}
  .stk:hover{transform:scale(.94);}
  .stk.filled{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);}
  .stk.auto{box-shadow:inset 0 0 0 3px rgba(16,185,129,.75);}
  .stk.bad{box-shadow:inset 0 0 0 3px rgba(239,83,80,.95);animation:pulseBad 1.1s infinite;}
  @keyframes pulseBad{0%,100%{opacity:1;}50%{opacity:.55;}}
  .infer-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:4px 0 2px;cursor:pointer;user-select:none;}
  .infer-status{font-size:12px;color:var(--accent2);min-height:18px;margin:0 0 8px;text-align:center;}
  .infer-toggle input{accent-color:var(--accent);width:15px;height:15px;}
  .face-title{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);}
  .rotbtn{position:absolute;top:-3px;right:-3px;z-index:5;cursor:pointer;border:none;
    background:var(--accent);color:#fff;border-radius:5px;font-size:11px;padding:0 6px;line-height:1.5;opacity:.9;}
  .rotbtn:hover{opacity:1;}
  .nface.turnnow{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px;}
  .nface.turnnow .face-title{color:var(--accent);font-weight:800;}
  .net-hint{font-size:11px;color:var(--muted);text-align:center;margin:2px auto 0;max-width:380px;line-height:1.5;}

  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;transition:background .12s,border-color .12s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.solve{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.solve:hover{background:#2f5fd8;color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:transparent;}

  #msg{margin-top:12px;font-size:13px;min-height:18px;}
  #msg.err{color:var(--warn);}
  #msg.ok{color:var(--accent2);}

  /* steps */
  #stepPanel .prog{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;margin:0 10px;}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s;}
  .steps{flex:1 1 auto;min-height:140px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap: 6px;}
  .step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fbfcff;}
  .step.cur{border-color:var(--accent);background:#eef3ff;box-shadow:0 0 0 2px rgba(59,110,240,.15);}
  .step.done{opacity:.55;}
  .step .no{width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .step.cur .no{background:var(--accent);}
  .step.done .no{background:var(--accent2);}
  .step .not{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:800;font-size:16px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:2px 9px;min-width:34px;text-align:center;}
  .step .ds{font-size:13px;color:var(--ink);}
  .stepctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .stepctrls .btn{flex:1;min-width:64px;text-align:center;}
  .done-banner{margin-top:12px;text-align:center;font-weight:800;color:var(--accent2);font-size:16px;}
</style>
</head>
<body>

<!-- ===================== INTRO ===================== -->
<div id="intro">
  <div class="intro-cube-wrap"><div class="intro-cube">
    <div class="fc f-front"></div><div class="fc f-back"></div>
    <div class="fc f-right"></div><div class="fc f-left"></div>
    <div class="fc f-top"></div><div class="fc f-bottom"></div>
  </div></div>
  <h1>魔方还原助手</h1>
  <p class="sub">鼠标逐格涂色 · 一键求解 · 3D 逐步引导还原</p>
  <button class="btn-primary" id="startBtn">开始使用</button>
  <div class="intro-tip">适合三阶魔方 · 无需联网 · 全部在本地运行</div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <div class="topbar">
    <h2>魔方还原助手</h2>
    <span class="hint">第 1 步：在下方网图上用鼠标给每个格子涂上对应颜色，再点“求解还原”</span>
  </div>

  <div class="layout">
    <!-- 舞台：左魔方 + 右步骤，并排常驻，求解时无需缩放即可同看 -->
    <div class="stage">
      <div class="card">
        <h3>实时魔方（可拖拽旋转视角）</h3>
        <div id="scene"></div>
        <div class="curmove" id="curMove">把你的魔方状态涂好，点“求解还原”开始</div>
      </div>

      <div class="card" id="stepPanel">
        <h3>还原步骤</h3>
        <div class="prog">
          <span id="progText">第 0 / 0 步</span>
          <span class="bar"><i id="progBar"></i></span>
        </div>
        <div class="steps" id="steps"></div>
        <div class="stepctrls">
          <button class="btn" id="btnFirst">⏮ 开头</button>
          <button class="btn" id="btnPrev">◀ 上一步</button>
          <button class="btn solve" id="btnPlay">▶ 自动</button>
          <button class="btn" id="btnNext">下一步 ▶</button>
          <button class="btn" id="btnLast">结尾 ⏭</button>
          <button class="btn ghost" id="btnExit">← 返回重新标记</button>
        </div>
        <div class="done-banner hidden" id="doneBanner">🎉 还原完成！</div>
      </div>
    </div>

    <!-- 编辑区：选择颜色 + 涂色，整行铺底 -->
    <div class="card">
      <h3>① 选择颜色（求解时会实时跟随魔方变动）</h3>
      <div class="palette" id="palette"></div>

      <h3>② 涂色（点选颜色后点格子）</h3>
      <label class="infer-toggle"><input type="checkbox" id="autoInfer" checked> 自动推断：涂一格，同块其他格按规则自动补全（绝不猜错）</label>
      <div id="inferStatus" class="infer-status"></div>
      <div class="net" id="net"></div>
      <div class="net-hint">每面按「该面正对你、白面朝上」的视角涂色。若报「朝向/奇偶」类错误，点该面右上角 ↻ 转正，或直接点求解（会自动校正单面朝向）。</div>

      <div class="actions">
        <button class="btn solve" id="btnSolve">求解还原</button>
        <button class="btn" id="btnDemo">随机示例</button>
        <button class="btn" id="btnDiagnose">诊断错误</button>
        <button class="btn ghost" id="btnCopy">复制配色</button>
        <button class="btn ghost" id="btnClear">清空</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>
</div>

const VEC_DIR = {};

function rotateVec(v, axis, dir) {
  const [x, y, z] = v;

function rotateColors(colors, axis, dir) {
  const nc = {};

  }

  // ===================== Three.js 真实 3D 魔方 =====================
  // WebGL 渲染：黑色塑料体 + 内嵌彩色贴纸；转层绕魔方中心轴刚性旋转。
  const THREE = window.THREE;
  const CELL = 1.0;   // 每格间距（世界单位）
  const BODY = 0.97;  // cubie 本体尺寸（黑色塑料，紧贴形成黑缝）
  const STK  = 0.82;  // 贴纸尺寸（内嵌，留黑边）

  // 方向键 -> 盒子面（与 cu.c 一致：px=+X(R) nx=-X(L) py=+Y(U) ny=-Y(D) pz=+Z(F) nz=-Z(B)）
  const DIR_FACE = {
    px:{axis:'x',sign: 1, rx:0,         ry: Math.PI/2},
    nx:{axis:'x',sign:-1, rx:0,         ry:-Math.PI/2},
    py:{axis:'y',sign: 1, rx:-Math.PI/2, ry:0},
    ny:{axis:'y',sign:-1, rx: Math.PI/2, ry:0},
    pz:{axis:'z',sign: 1, rx:0,         ry:0},
    nz:{axis:'z',sign:-1, rx:0,         ry: Math.PI}
  };

  const tScene = new THREE.Scene();
  const tCamera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  tCamera.position.set(4.4, 4.0, 5.8); tCamera.lookAt(0,0,0);
  const tRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  tRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  sceneEl.appendChild(tRenderer.domElement);

  tScene.add(new THREE.AmbientLight(0xffffff, 0.50));
  const tKey = new THREE.DirectionalLight(0xffffff, 0.72); tKey.position.set(6,9,7);  tScene.add(tKey);
  const tFill= new THREE.DirectionalLight(0xffffff, 0.30); tFill.position.set(-7,-2,-5); tScene.add(tFill);
  const tRim = new THREE.DirectionalLight(0xffffff, 0.18); tRim.position.set(0,-7,4);   tScene.add(tRim);

  const viewGroup = new THREE.Group();   // 视角（拖拽 / 空闲自转）
  const cubeGroup = new THREE.Group();   // 魔方本体（26 cubie）
  viewGroup.add(cubeGroup); tScene.add(viewGroup);
  viewGroup.rotation.x = -0.40; viewGroup.rotation.y = 0.62;  // 初始看到 U/R/F 三面

  // ----- 构建 26 个 cubie 网格（顺序同 CM.solvedCubies）-----
  const cubieMeshes = [];
  (function buildCubies(){
    const model = CM.solvedCubies();
    const bodyGeo = new THREE.BoxGeometry(BODY, BODY, BODY);
    const stkGeo  = new THREE.PlaneGeometry(STK, STK);
    const bodyMat = new THREE.MeshStandardMaterial({ color:0x15181d, roughness:0.5, metalness:0.04 });
    model.forEach(()=>{
      const g = new THREE.Group();
      g.add(new THREE.Mesh(bodyGeo, bodyMat));
      const mats = {};
      Object.keys(DIR_FACE).forEach(d=>{
        const m = new THREE.MeshStandardMaterial({ color:0x222831, roughness:0.4, metalness:0.0 });
        const p = new THREE.Mesh(stkGeo, m);
        const f = DIR_FACE[d], off = BODY/2 + 0.002;
        p.rotation.x = f.rx; p.rotation.y = f.ry;
        p.position.x = f.axis==='x' ? f.sign*off : 0;
        p.position.y = f.axis==='y' ? f.sign*off : 0;
        p.position.z = f.axis==='z' ? f.sign*off : 0;
        g.add(p); mats[d] = m;
      });
      cubeGroup.add(g); cubieMeshes.push({ group:g, mats });
    });
  })();

  function renderCubies(){
    cubies.forEach((cu,i)=>{
      const cm = cubieMeshes[i];
      cm.group.position.set(cu.x*CELL, cu.y*CELL, cu.z*CELL);
      cm.group.rotation.set(0,0,0);
      const surf = { px:cu.x===1, nx:cu.x===-1, py:cu.y===1, ny:cu.y===-1, pz:cu.z===1, nz:cu.z===-1 };
      Object.keys(cm.mats).forEach(d=>{
        if(surf[d]){
          let col = cu.c[d];
          if(col && col.length===1) col = null;            // 理论上不会出现单字母
          cm.mats[d].color.set(col || '#222831');
          cm.mats[d].visible = true;
        } else {
          cm.mats[d].visible = false;                       // 内面贴纸隐藏，露出黑色本体
        }
      });
    });
  }

  // ----- 单步转动：该层 9 块作为刚性圆盘绕魔方中心轴旋转 -----
  function animateMove(face, dir, done){
    animating = true;
    const [axis, layer] = FACE_AXIS[face];
    const theta = dir * Math.PI/2;   // 绕魔方中心轴；dir=+1/-1 对应标准转法
    const pivot = new THREE.Group(); cubeGroup.add(pivot);
    const layerIdx = [];
    cubies.forEach((cu,i)=>{ if(cu[axis]===layer){ pivot.attach(cubieMeshes[i].group); layerIdx.push(i); } });
    const dur = 320, t0 = performance.now();
    (function tween(now){
      let t = Math.min(1, (now - t0)/dur);
      const e = t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;   // easeInOutQuad
      pivot.rotation[axis] = theta * e;
      if(t < 1) requestAnimationFrame(tween);
      else {
        pivot.rotation[axis] = theta; pivot.updateMatrixWorld(true);
        layerIdx.forEach(i=> cubeGroup.attach(cubieMeshes[i].group));
        cubeGroup.remove(pivot);
        CM.applyMove(cubies, face, dir);
        renderCubies(); syncNetFromCube();   // 提交模型并重新着色 / 网图跟随
        animating = false; done && done();
      }
    })(t0);
  }

  // ----- 视角拖拽 + 空闲自转 + 渲染循环 -----
  let dragging=false, lastX=0, lastY=0;
  sceneEl.addEventListener('pointerdown', e=>{
    dragging=true; lastX=e.clientX; lastY=e.clientY;
    if(sceneEl.setPointerCapture){ try{ sceneEl.setPointerCapture(e.pointerId); }catch(_){} }
  });
  sceneEl.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    viewGroup.rotation.y += dx*0.01;
    viewGroup.rotation.x += dy*0.01;
    viewGroup.rotation.x = Math.max(-1.3, Math.min(1.3, viewGroup.rotation.x));
    lastX=e.clientX; lastY=e.clientY;
  });
  const endDrag=()=>{ dragging=false; };
  sceneEl.addEventListener('pointerup', endDrag);
  sceneEl.addEventListener('pointercancel', endDrag);
  sceneEl.addEventListener('pointerleave', endDrag);

  function resize(){
    const w = Math.max(320, sceneEl.clientWidth  || 360);
    const h = Math.max(320, sceneEl.clientHeight || 380);
    tRenderer.setSize(w, h);
    tCamera.aspect = w/h; tCamera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  (function loop(){
    if(!dragging && !animating){ viewGroup.rotation.y += 0.0035; }  // 空闲缓慢自转
    tRenderer.render(tScene, tCamera);
    requestAnimationFrame(loop);
  })();

  // ----- messages -----
  function setMsg(t, type){ msgEl.textContent=t||''; msgEl.className=type||''; }

  // ----- solve -----
  // Find every net index that belongs to a cubie whose color set is impossible
  // (duplicate colors, opposite colors on same corner/edge, or unknown combination).
  function findBadCells(){
    const bad=new Set();
    const cubies=CM.solvedCubies().map(c=>({x:c.x,y:c.y,z:c.z,c:{}}));
    for(let f=0;f<6;f++){
      const face=FACE_ORDER[f];
      for(let r=0;r<3;r++){
        for(let c=0;c<3;c++){
          const idx=f*9+r*3+c;
          const p=FACE_MAP[face](r,c);
          const cu=cubies.find(x=>x.x===p.x && x.y===p.y && x.z===p.z);
          if(cu) cu.c[p.dir]=net[idx];
        }
      }
    }
    const valid=new Set();
    const rots=[['x',1],['x',2],['x',3],['y',1],['y',2],['y',3],['z',1],['z',2],['z',3]];
    for(const base of CM.solvedCubies()){
      valid.add(Object.values(base.c).filter(Boolean).sort().join(','));
      for(const [axis,dir] of rots){
        const rc=rotateColors(base.c,axis,dir);
        valid.add(Object.values(rc).filter(Boolean).sort().join(','));
      }
    }
    for(const cu of cubies){
      const sig=Object.values(cu.c).filter(Boolean).sort().join(',');
      if(!valid.has(sig)){
        for(let f=0;f<6;f++){
          const face=FACE_ORDER[f];
          for(let r=0;r<3;r++){
            for(let c=0;c<3;c++){
              const idx=f*9+r*3+c;
              const p=FACE_MAP[face](r,c);
              if(p.x===cu.x && p.y===cu.y && p.z===cu.z) bad.add(idx);
            }
          }
        }
      }
    }
    return [...bad];
  }

  function highlightBad(indices){
    if(!indices) return;
    indices.forEach(idx=>{
      const f=FACE_ORDER[Math.floor(idx/9)], pos=idx%9;
      const st=netEl.querySelector(`.nface.${f} .stk[data-pos="${pos}"]`);
      if(st) st.classList.add('bad');
    });
  }

  function validate(){
    if(net.some(c=>c===null)) return {ok:false, type:'incomplete', msg:'还有格子没涂色，请涂满全部 54 格。'};
    const cnt={}; net.forEach(c=>cnt[c]=(cnt[c]||0)+1);
    for(const c of COLORS){
      if((cnt[c.hex]||0)!==9) return {ok:false, type:'count', msg:`颜色「${c.name}」数量不对（应为 9，现在是 ${cnt[c.hex]||0}）。`, colorName:c.name, badIndices:net.map((h,i)=>h===c.hex?i:-1).filter(i=>i>=0)};
    }
    let str;
    try{ str=CM.faceletStringFromNet(net); }catch(e){
      const dup=[], seen={};
      for(let f=0;f<6;f++){ const h=net[f*9+4], idx=f*9+4; if(seen[h]){dup.push(seen[h]); dup.push(idx);} seen[h]=idx; }
      return {ok:false, type:'centers', msg:'无法生成配色串：6 个中心颜色必须互不相同。请检查哪个中心涂错了。', badIndices:[...new Set(dup)]};
    }
    const cube=R.Cube.fromString(str);
    const v=cube.verify();
    if(v!==true) return {ok:false, type:'parity', msg:'配色非法：'+v+'（真实魔方不会出现这种情况，请检查是否涂错）。', badIndices:findBadCells()};
    return {ok:true};
  }

  function buildMoves(solutionStr){
    return solutionStr.trim().split(/\s+/).filter(Boolean).map(tok=>{
      const face=tok[0]; const mod=tok.slice(1);
      const dir = mod==="'" ? -DIRS[face] : (mod==='2' ? 2 : DIRS[face]);
      const ds = mod==='2' ? FACE_CN[face]+'转 180°' : (mod==="'" ? FACE_CN[face]+'逆时针' : FACE_CN[face]+'顺时针');
      return {face, dir, token:tok, mod, ds};
    });
  }

  function startSolve(){
    const res=validate();
    if(!res.ok){
      if(res.type==='parity'){
        const fix=tryAutoOrient(net);
        if(fix){
          net=fix.n; repaintAll();
          cubies=CM.modelFromNet(net); renderCubies();
          setMsg(`检测到「${FACE_CN[FACE_ORDER[fix.f]]}」面朝向可能不对，已自动转正并重新求解。若还原后某面仍异常，可点该面右上角 ↻ 手动调整。`,'ok');
        } else {
          highlightBad(res.badIndices);
          setMsg(res.msg+(res.badIndices&&res.badIndices.length?` 已用红框标出 ${res.badIndices.length} 个相关格子，请重点检查。`:' 已尝试自动校正各面朝向仍未通过，请检查是否有格子涂错/漏涂（可点「随机示例」对照涂色方式）。'),'err'); return;
        }
      } else if(res.type==='count' || res.type==='centers'){
        highlightBad(res.badIndices);
        setMsg(res.msg+(res.badIndices&&res.badIndices.length?' 已用红框标出相关格子。':''),'err'); return;
      } else { setMsg(res.msg,'err'); return; }
    }
    setMsg('正在求解…','ok');
    // solve is synchronous (tables already warmed up)
    const str=CM.faceletStringFromNet(net);
    const cube=R.Cube.fromString(str);

    // Short-circuit: if the painted cube is already solved, Kociemba may still
    // emit a non-trivial (identity-equivalent) move string, which would
    // confuse the user. Skip the steps entirely.
    if(cube.isSolved()){
      moves=[]; pointer=0; playing=false; jumpTarget=null; solving=false;
      cubies=CM.modelFromNet(net); renderCubies();
      clearNetFaceMark();
      stepsEl.innerHTML='';
      buildStepsUI(); updateStepsUI();
      setMsg('🎉 你的魔方已经还原好了，无需求解。','ok');
      return;
    }

    const sol=R.solve(cube);
    if(!sol){ setMsg('求解失败，请检查配色。','err'); return; }

    // Defensive verify: apply the solution to the cube and ensure it becomes solved.
    let v=R.Cube.fromString(str);
    for(const tk of sol.split(/\s+/).filter(Boolean)) v=v.move(tk);
    if(!v.isSolved()){
      setMsg('求解器返回的方案未通过验证，请重新涂色再试。','err'); return;
    }

    // Post-process: collapse strictly-consecutive same-face moves
    // (e.g. R R R R → identity, R R R → R', R R → R2). Kociemba usually
    // emits minimal output, but this catches the rare redundant case.
    const sol2=compressSolution(sol);
    moves=buildMoves(sol2);
    pointer=0; playing=false; jumpTarget=null; solving=true;
    cubies=CM.modelFromNet(net); renderCubies();
    buildStepsUI();
    stepPanel.classList.remove('hidden');
    setMsg(`已生成 ${moves.length} 步还原方案。跟着 3D 动画逐步转动即可。`,'ok');
    updateStepsUI();
  }

  // Collapse strictly-consecutive same-face moves. Safe because same-face
  // moves are mathematically commutative (they share no piece). Cross-face
  // cancellations are NOT touched (those require full cube simulation).
  function compressSolution(sol){
    const toks = sol.trim().split(/\s+/).filter(Boolean);
    const out=[];
    for(const t of toks){
      const face=t[0]; const mod=t.slice(1);
      const p = mod==='2' ? 2 : (mod==="'" ? 3 : 1);
      if(out.length && out[out.length-1].face===face){
        const prev=out.pop();
        const tot=(prev.p + p) % 4;
        if(tot===0) continue;
        out.push({face, p:tot, mod: tot===2 ? '2' : (tot===3 ? "'" : '')});
      } else {
        out.push({face, p, mod});
      }
    }
    return out.map(m=>m.face+m.mod).join(' ');
  }

  function buildStepsUI(){
    stepsEl.innerHTML='';
    moves.forEach((m,i)=>{
      const row=document.createElement('div'); row.className='step'; row.dataset.i=i;
      row.innerHTML=`<span class="no">${i+1}</span><span class="not">${m.token}</span><span class="ds">${m.ds}</span>`;
      row.addEventListener('click',()=>{ if(animating) return; jumpTarget=i; tick(); });
      stepsEl.appendChild(row);
    });
  }
  function updateStepsUI(){
    [...stepsEl.children].forEach((row,i)=>{
      row.classList.toggle('cur', i===pointer);
      row.classList.toggle('done', i<pointer);
    });
    progText.textContent=`第 ${pointer} / ${moves.length} 步`;
    progBar.style.width = moves.length? (pointer/moves.length*100)+'%' : '0%';
    doneBanner.classList.toggle('hidden', pointer!==moves.length);
    if(pointer===moves.length){ curMoveEl.textContent='🎉 已全部完成，魔方还原！'; clearNetFaceMark(); }
    else if(pointer===0) curMoveEl.textContent='准备开始：点“下一步”或“自动”';
  }

  // ----- stepping engine -----
  function doNext(){
    if(animating) return;
    if(pointer>=moves.length) return;
    const m=moves[pointer];
    curMoveEl.textContent=`第 ${pointer+ 1} 步：${m.ds}（${m.token}）`;
    markNetFace(m.face);
    animateMove(m.face, m.dir, ()=>{ pointer++; updateStepsUI(); afterStep(); });
  }
  function doPrev(){
    if(animating) return;
    if(pointer<=0) return;
    const m=moves[pointer-1];
    markNetFace(m.face);
    const inv = m.dir===2 ? 2 : -m.dir;
    curMoveEl.textContent=`回退：${m.ds}（${m.token}）反向`;
    animateMove(m.face, inv, ()=>{ pointer--; updateStepsUI(); afterStep(); });
  }
  function afterStep(){
    if(jumpTarget!==null){
      if(pointer<jumpTarget) doNext();
      else if(pointer>jumpTarget) doPrev();
      else jumpTarget=null;
      return;
    }
    if(playing){ if(pointer<moves.length) setTimeout(()=>{ if(playing) doNext(); }, 250); else { playing=false; setPlayBtn(); } }
  }
  function tick(){
    if(animating) return;
    if(jumpTarget!==null){ if(pointer<jumpTarget) doNext(); else if(pointer>jumpTarget) doPrev(); else jumpTarget=null; return; }
    if(playing){ if(pointer<moves.length) doNext(); else { playing=false; setPlayBtn(); } }
  }

  function setPlayBtn(){ $('btnPlay').textContent = playing? '⏸ 暂停' : '▶ 自动'; }

  $('btnSolve').addEventListener('click', startSolve);
  $('btnNext').addEventListener('click',()=>{ jumpTarget=null; if(!playing) doNext(); });
  $('btnPrev').addEventListener('click',()=>{ jumpTarget=null; if(!playing) doPrev(); });
  $('btnPlay').addEventListener('click',()=>{ playing=!playing; setPlayBtn(); tick(); });
  $('btnFirst').addEventListener('click',()=>{ jumpTarget=0; tick(); });
  $('btnLast').addEventListener('click',()=>{ jumpTarget=moves.length; tick(); });
  $('btnExit').addEventListener('click',()=>{
    playing=false; setPlayBtn(); solving=false; jumpTarget=null;
    clearNetFaceMark();
    stepsEl.innerHTML='';
    cubies=CM.modelFromNet(net); renderCubies();
    curMoveEl.textContent='已返回标记模式，可重新涂色或求解';
  });

  // ----- demo / clear -----
  $('btnDemo').addEventListener('click',()=>{
    if(!R.__ready){ R.initSolver(); R.__ready=true; }
    const scr=R.scramble(20);
    const str=R.Cube.fromString(CANON).move(scr).asString();
    net = str.split('').map(ch=>LETTER_HEX[ch]);
    autoFilled.clear(); if(inferEl) inferEl.textContent=''; repaintAll();
    cubies=CM.modelFromNet(net); renderCubies();
    setMsg('已生成一个随机打乱的魔方，直接点“求解还原”试试。','ok');
  });
  $('btnClear').addEventListener('click',()=>{
    net=new Array(54).fill(null); autoFilled.clear(); if(inferEl) inferEl.textContent=''; repaintAll();
    cubies=CM.modelFromNet(net); renderCubies(); setMsg('');
  });

  // 诊断：只验证、不求解，用红框标出问题格并给出详细原因
  function diagnose(){
    const res=validate();
    // 清除旧红框
    netEl.querySelectorAll('.stk').forEach(st=>st.classList.remove('bad'));
    if(res.ok){
      setMsg('当前配色看起来合法，可以点「求解还原」进行还原。','ok'); return;
    }
    if(res.badIndices && res.badIndices.length) highlightBad(res.badIndices);
    if(res.type==='incomplete'){
      setMsg(`还有 ${net.filter(c=>c===null).length} 格没涂色，请继续涂满 54 格。`,'err');
    } else if(res.type==='count'){
      setMsg(`${res.msg} 红框标出的都是「${res.colorName || ''}」格子，请检查这些位置是否看错/涂错。`,'err');
    } else if(res.type==='centers'){
      setMsg(`${res.msg} 红框标出的是重复的中心格子。`,'err');
    } else {
      setMsg(`${res.msg}${res.badIndices && res.badIndices.length?` 已用红框标出 ${res.badIndices.length} 个相关格子。`:''}`,'err');
    }
  }
  $('btnDiagnose').addEventListener('click', diagnose);

  // 复制当前 54 格配色数据到剪贴板，便于发给别人精确诊断
  function copyNet(){
    const rows=[];
    for(let f=0;f<6;f++){
      const face=FACE_ORDER[f];
      const line=[];
      for(let r=0;r<3;r++){
        const row=[];
        for(let c=0;c<3;c++){
          const h=net[f*9+r*3+c];
          const col=COLORS.find(x=>x.hex===h);
          row.push(col?col.key:'?');
        }
        line.push(row.join(''));
      }
      rows.push(`${face}:${line.join('|')}`);
    }
    const text = rows.join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>setMsg('已把当前 54 格配色复制到剪贴板，可直接粘贴发给他人诊断。','ok'));
    } else {
      // fallback
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); setMsg('已复制配色数据到剪贴板。','ok'); }
      catch(e){ setMsg('复制失败，请手动复制控制台输出。','err'); console.log(text); }
      document.body.removeChild(ta);
    }
  }
  $('btnCopy').addEventListener('click', copyNet);

  // ----- intro -----
  $('startBtn').addEventListener('click',()=>{
    $('intro').classList.add('hidden');
    $('app').classList.remove('hidden');
    if(typeof resize==='function') resize();
    renderCubies();
  });

  // warm up solver tables during intro (2s), so first solve is instant
  setTimeout(()=>{ try{ R.initSolver(); R.__ready=true; R.solve(R.Cube.fromString(CANON)); }catch(e){} }, 200);

  renderCubies();
})();
</script>
</body>
</html>
